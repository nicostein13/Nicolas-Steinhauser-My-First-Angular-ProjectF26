<div class="container">
@for (pokemon of pokemonList(); track pokemon.id; let isEven = $even, total = $count;){
  @if($first){
    <h2 class="count">Showing {{ $count }} Pokemon</h2>
  }
  <app-pokemon-list-item
    [pokemon]="pokemon"
    [class.even-row]="isEven"
    [class.odd-row]="!isEven"
    [class.first-card]="$first"
    [class.last-card]="$last"
  />
}@empty{
  <p>No Pokemon found.</p>
}
</div>
<div>
  <h1>Active Pokemon</h1>
  @for(p of pokemonWithActive(); track p.id){
    <h3>{{ p.name }}</h3>
  }
</div>
